services:
  - type: web
    name: coc-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: COC_API_KEY
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: MONGODB_URI
        sync: false
